<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Oups !</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f8f9fa;
            color: #343a40;
        }
        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }
        p {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 30px;
        }
        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #dc3545;
            margin: 20px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
</style>
</head>
<body>
    <div class="error-code">404</div>
    <div class="emoji">😕</div>
    <h1>Oups !</h1>
    <p>Il y a eu un problème avec cette page.</p>
    <p>Elle semble ne pas exister ou être temporairement indisponible.</p>
    <p><a href="https://maison-johnco-marketing.com/">Retour à l'accueil</a></p>
</body>
</html>
