<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBLICITÉ DIGITALE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .service-card {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-16">PUBLICITÉ DIGITALE</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Publicité en Ligne (PPC) -->
            <a href="publicite-en-ligne-ppc" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-blue-100 p-4 rounded-full mb-4">
                    <i data-feather="trending-up" class="text-blue-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Publicité en Ligne (PPC)</h3>

            </a>

            <!-- Publicité ADS Réseaux Sociaux -->
            <a href="publicite-ads-reseaux-sociaux" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-purple-100 p-4 rounded-full mb-4">
                    <i data-feather="pen-tool" class="text-purple-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Publicité ADS Réseaux Sociaux</h3>
                <p class="text-purple-600 font-medium">En savoir plus →</p>
            </a>

            <!-- Display Programmatique -->
            <a href="display-programmatique" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-red-100 p-4 rounded-full mb-4">
                    <i data-feather="dollar-sign" class="text-red-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Display Programmatique</h3>
                <p class="text-red-600 font-medium">En savoir plus →</p>
            </a>

            <!-- Retargeting & Remarketing -->
            <a href="retargeting-remarketing" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-green-100 p-4 rounded-full mb-4">
                    <i data-feather="search" class="text-green-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Retargeting & Remarketing</h3>
                <p class="text-green-600 font-medium">En savoir plus →</p>

            <a href="publicite-native" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-yellow-100 p-4 rounded-full mb-4">
                    <i data-feather="edit" class="text-yellow-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Publicité Native</h3>
                <p class="text-yellow-600 font-medium">En savoir plus →</p>
            </a>

            <!-- Publicité Vidéo -->
            <a href="publicite-video" class="service-card bg-white rounded-xl p-6 flex flex-col items-center text-center">
                <div class="bg-indigo-100 p-4 rounded-full mb-4">
                    <i data-feather="refresh-cw" class="text-indigo-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Publicité Vidéo</h3>
                <p class="text-indigo-600 font-medium">En savoir plus →</p>

        feather.replace();
