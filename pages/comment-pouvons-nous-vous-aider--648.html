<!-- wp:html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteQuest - Formulaire Intelligent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="style.css"> </head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-xl overflow-hidden">
        <div class="p-6 md:p-8">
            <div class="mb-8">
                <div class="flex justify-between mb-2 text-sm text-gray-600">
                    <span>Progression</span>
                    <span id="progress-step">1/5</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 20%"></div>
                </div>
            </div>

            <div id="initial-choice" class="text-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Comment pouvons-nous vous aider ?</h2>
                <div class="grid gap-4 md:grid-cols-2">
                    <button id="quote-btn" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-300 transition-all flex flex-col items-center">
                        <i data-feather="dollar-sign" class="w-10 h-10 text-blue-600 mb-3"></i>
                        <h3 class="font-semibold text-lg mb-2">🚀 Demander un Devis</h3>
                        <p class="text-gray-600 text-sm">Obtenez une estimation précise pour votre projet</p>
                    </button>
                    <button id="info-btn" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-300 transition-all flex flex-col items-center">
                        <i data-feather="help-circle" class="w-10 h-10 text-blue-600 mb-3"></i>
                        <h3 class="font-semibold text-lg mb-2">❓ Obtenir des Renseignements</h3>
                        <p class="text-gray-600 text-sm">Posez vos questions sans engagement</p>
                    </button>
                </div>
            </div>

            <form id="info-form" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Informations de contact</h2>
                <div class="space-y-4">
                    <div>
                        <label for="info-name" class="block text-sm font-medium text-gray-700 mb-1">Nom complet *</label>
                        <input type="text" id="info-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="info-email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                        <input type="email" id="info-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="info-phone" class="block text-sm font-medium text-gray-700 mb-1">Téléphone *</label>
                        <input type="tel" id="info-phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div class="mt-8 flex justify-between">
                    <button type="button" id="info-back" class="px-6 py-2 text-gray-600 font-medium rounded-lg hover:bg-gray-100">Retour</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Envoyer ma demande</button>
                </div>
            </form>

            <form id="quote-form-phase1" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Identification (1/3)</h2>
                <div class="space-y-4">
                    <div>
                        <label for="quote-name" class="block text-sm font-medium text-gray-700 mb-1">Nom complet *</label>
                        <input type="text" id="quote-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="quote-email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                        <input type="email" id="quote-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="quote-phone" class="block text-sm font-medium text-gray-700 mb-1">Téléphone *</label>
                        <input type="tel" id="quote-phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Statut *</label>
                        <div class="space-y-2">
                            <div class="flex items-center">
                                <input type="radio" id="profile-company" name="profile" value="company" required class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                                <label for="profile-company" class="ml-2 text-sm text-gray-700">Entreprise / Organisation</label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="profile-influencer" name="profile" value="influencer" required class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                                <label for="profile-influencer" class="ml-2 text-sm text-gray-700">Influenceur / Créateur de contenu</label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="profile-individual" name="profile" value="individual" required class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                                <label for="profile-individual" class="ml-2 text-sm text-gray-700">Particulier</label>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="budget" class="block text-sm font-medium text-gray-700 mb-1">Budget approximatif *</label>
                        <select id="budget" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option value="" disabled selected>Sélectionnez une option</option>
                            <option value="<500">Inférieur à 500€</option>
                            <option value="500-2000">500€ à 2 000€</option>
                            <option value="2000-5000">2 000€ à 5 000€</option>
                            <option value="5000-10000">5 000€ à 10 000€</option>
                            <option value=">10000">10 000€ et plus</option>
                            <option value="undefined">Budget non défini</option>
                        </select>
                    </div>
                    <div>
                        <label for="timeline" class="block text-sm font-medium text-gray-700 mb-1">Délai idéal *</label>
                        <select id="timeline" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            <option value="" disabled selected>Sélectionnez une option</option>
                            <option value="asap">Dès que possible</option>
                            <option value="1-3">Dans 1 à 3 mois</option>
                            <option value="3-6">Dans 3 à 6 mois</option>
                            <option value="later">Plus tard</option>
                        </select>
                    </div>
                </div>
                <div class="mt-8 flex justify-end">
                    <button type="button" id="phase1-next" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Continuer</button>
                </div>
            </form>

            <form id="quote-form-phase2" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-6" id="phase2-title">Détails spécifiques (2/3)</h2>
                
                <div id="company-fields" class="hidden space-y-4">
                    </div>

                <div id="influencer-fields" class="hidden space-y-4">
                    </div>

                <div id="individual-fields" class="hidden space-y-4">
                    </div>

                <div class="mt-8 flex justify-between">
                    <button type="button" id="phase2-back" class="px-6 py-2 text-gray-600 font-medium rounded-lg hover:bg-gray-100">Retour</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Envoyer ma demande</button>
                </div>
            </form>

            <div id="success-message" class="hidden text-center py-12">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                    <i data-feather="check" class="h-6 w-6 text-green-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Merci pour votre demande !</h2>
                <p class="text-gray-600 mb-6">Nous avons bien reçu votre demande et vous contacterons très rapidement.</p>
                <button id="new-request" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Nouvelle demande</button>
            </div>
        </div>
    </div>

    <script>
        // Initialisation des icônes Feather
        feather.replace();

        // 1. Récupération des éléments principaux
        const initialChoice = document.getElementById('initial-choice');
        const quoteBtn = document.getElementById('quote-btn');
        const infoBtn = document.getElementById('info-btn');
        const infoForm = document.getElementById('info-form');
        const quoteFormPhase1 = document.getElementById('quote-form-phase1');
        const quoteFormPhase2 = document.getElementById('quote-form-phase2');
        const phase1NextBtn = document.getElementById('phase1-next');
        const infoBackBtn = document.getElementById('info-back');
        const phase2BackBtn = document.getElementById('phase2-back');

        const companyFields = document.getElementById('company-fields');
        const influencerFields = document.getElementById('influencer-fields');
        const individualFields = document.getElementById('individual-fields');
        const profileRadios = document.querySelectorAll('input[name="profile"]');

        // Éléments de progression (simplifié pour cet exemple)
        const progressBar = document.getElementById('progress-bar');
        const progressStep = document.getElementById('progress-step');

        // Fonction pour mettre à jour la barre de progression (simplifiée)
        function updateProgress(step, total, width) {
            progressStep.textContent = `${step}/${total}`;
            progressBar.style.width = `${width}%`;
        }

        // --- 2. Gestion de l'étape de choix initial ---

        // Au clic sur "Demander un Devis"
        quoteBtn.addEventListener('click', () => {
            initialChoice.classList.add('hidden');
            quoteFormPhase1.classList.remove('hidden');
            updateProgress(1, 3, 33); // Mise à jour de la progression pour le devis
        });

        // Au clic sur "Obtenir des Renseignements"
        infoBtn.addEventListener('click', () => {
            initialChoice.classList.add('hidden');
            infoForm.classList.remove('hidden');
            updateProgress(1, 1, 100); // Progression complète car un seul formulaire
        });

        // --- 3. Gestion des boutons Retour (pour les deux parcours) ---

        // Bouton Retour du formulaire de Renseignements
        infoBackBtn.addEventListener('click', () => {
            infoForm.classList.add('hidden');
            initialChoice.classList.remove('hidden');
            updateProgress(1, 5, 20); // Retour à la progression initiale
        });

        // Bouton Retour de la Phase 2 du Devis
        phase2BackBtn.addEventListener('click', () => {
            quoteFormPhase2.classList.add('hidden');
            quoteFormPhase1.classList.remove('hidden');
            updateProgress(1, 3, 33); // Retour à la phase 1 du devis
        });

        // --- 4. Gestion du bouton Continuer de la Phase 1 du Devis ---

        phase1NextBtn.addEventListener('click', () => {
            // Ici, vous devez ajouter une validation de base avant de passer à l'étape suivante.
            // Pour l'exemple, nous nous assurons que tous les champs requis de Phase 1 sont remplis.
            const requiredFields = quoteFormPhase1.querySelectorAll('[required]');
            let isValid = true;

            requiredFields.forEach(field => {
                if (!field.value || (field.type === 'radio' && !document.querySelector('input[name="profile"]:checked'))) {
                    isValid = false;
                    field.classList.add('border-red-500'); // Ajout d'un indicateur visuel
                } else {
                    field.classList.remove('border-red-500');
                }
            });

            if (isValid) {
                // Masquer Phase 1 et afficher Phase 2
                quoteFormPhase1.classList.add('hidden');
                quoteFormPhase2.classList.remove('hidden');
                updateProgress(2, 3, 66); // Mise à jour de la progression

                // Déclencher la logique de l'étape 5 : Affichage des champs spécifiques
                displayProfileFields();
            } else {
                alert("Veuillez remplir tous les champs obligatoires avant de continuer.");
            }
        });

        // --- 5. Logique Conditionnelle (Affichage des champs spécifiques) ---

        // Fonction qui gère l'affichage des champs de la Phase 2 en fonction du profil choisi
        function displayProfileFields() {
            // Masquer tous les champs spécifiques par défaut
            companyFields.classList.add('hidden');
            influencerFields.classList.add('hidden');
            individualFields.classList.add('hidden');

            const selectedProfile = document.querySelector('input[name="profile"]:checked')?.value;
            const phase2Title = document.getElementById('phase2-title');

            if (selectedProfile === 'company') {
                companyFields.classList.remove('hidden');
                phase2Title.textContent = "Détails Entreprise (2/3)";
            } else if (selectedProfile === 'influencer') {
                influencerFields.classList.remove('hidden');
                phase2Title.textContent = "Détails Influenceur (2/3)";
            } else if (selectedProfile === 'individual') {
                individualFields.classList.remove('hidden');
                phase2Title.textContent = "Détails Particulier (2/3)";
            }
        }

        // Écouteur pour mettre à jour les champs spécifiques si le profil est changé (même si l'utilisateur revient en arrière)
        profileRadios.forEach(radio => {
            radio.addEventListener('change', displayProfileFields);
        });

        // --- 6. Gestion de la soumission du formulaire (Pour l'exemple) ---
        
        // Simuler la soumission (à remplacer par votre code d'envoi réel, par exemple via AJAX ou Fetch API vers votre endpoint WordPress)
        const allForms = [infoForm, quoteFormPhase2];
        const successMessage = document.getElementById('success-message');

        allForms.forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // *** Votre code d'envoi de mail ici (AJAX/Fetch) ***

                // Simulation de succès après envoi (à supprimer une fois le vrai envoi codé)
                form.classList.add('hidden');
                successMessage.classList.remove('hidden');
                updateProgress(3, 3, 100); 
                
                // Reset de la page après 3 secondes
                setTimeout(() => {
                    successMessage.classList.add('hidden');
                    initialChoice.classList.remove('hidden');
                    updateProgress(1, 5, 20); 
                    form.reset();
                }, 3000); 
            });
        });

        // Bouton Nouvelle demande
        document.getElementById('new-request').addEventListener('click', () => {
            successMessage.classList.add('hidden');
            initialChoice.classList.remove('hidden');
            updateProgress(1, 5, 20); 
        });

    </script>
</body>
</html>
<!-- /wp:html -->
